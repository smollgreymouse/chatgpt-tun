name: macOS and Windows distributions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            kind: macos
          - os: windows-2022
            kind: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install for tests
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: CLI smoke test
        run: python -m chatgpt_tun --help
      - name: Build macOS package
        if: matrix.kind == 'macos'
        shell: bash
        run: bash scripts/build-macos.sh
      - name: Build Windows archive
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build self-contained Windows executable
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --noconfirm --onedir --name ctun --distpath build/windows-dist packaging/windows/entry.py
          & ./build/windows-dist/ctun/ctun.exe --version
          & ./build/windows-dist/ctun/ctun.exe doctor --json
          if ($LASTEXITCODE -ne 2 -and $LASTEXITCODE -ne 0) { exit 1 }
          exit 0
      - name: Package Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $sourceDir = (Resolve-Path "build/windows-dist/ctun").Path
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$sourceDir" packaging/windows/ctun.iss
      - name: Validate tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${expected}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctun-${{ matrix.kind }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for i in {1..15}; do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

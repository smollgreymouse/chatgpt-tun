name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Validate release version
        shell: bash
        run: |
          version="$(bash scripts/version.sh)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag and pyproject.toml version disagree" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build distribution packages
        run: bash scripts/build-packages.sh
      - name: Configure official ngrok APT repository
        run: sudo bash scripts/setup-ngrok-apt.sh
      - name: Smoke test Debian installation with dependencies
        run: |
          sudo apt-get install -y "./dist/chatgpt-tun_${VERSION}_amd64.deb"
          ctun --help
          chatgpt-tun --help
          sudo apt-get remove -y chatgpt-tun
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-tun-${{ env.VERSION }}-linux-amd64
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "chatgpt-tun ${VERSION}" \
            --generate-notes \
            --verify-tag
